services:
  - type: web
    name: questionary
    env: ruby
    region: frankfurt
    plan: free
    branch: main
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rails server"
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: questionary-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: SOLID_QUEUE_IN_PUMA
        value: true
      - key: WEB_CONCURRENCY
        value: 2

databases:
  - name: questionary-db
    region: frankfurt
    plan: free
    ipAllowList: []
